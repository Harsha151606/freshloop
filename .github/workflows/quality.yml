name: FreshLoop quality checks

on:
  push:
    branches:
      - main
      - "stabilize/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: freshloop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://phijyskajmshmkgzcyzj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      NEXT_PUBLIC_APP_URL: https://freshloop-ai-harsha-6f44.vercel.app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build production application
        run: npm run build
